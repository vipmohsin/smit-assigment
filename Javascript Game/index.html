<!DOCTYPE html>
<html>
<head>
    <title>Color Match Game</title>
    <style>
             * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f0f0;
            text-align: center;
         
        }

        header {
            margin-bottom: 20px;
            background-color: black;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        #color {
            font-size: 2.5rem;
            width: 60px;
            height: 60px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin: 20px 0;
            color: #333;
            border: 20px;
            margin: 0 auto;
        }

        nav h3 {
            font-size: 1.2rem;
            color: white;
        }

        #score {
            font-weight: bold;
            color: green;
        }

        .box-container {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        #box-con {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 10px;
            width: 100%;
            max-width: 600px;
        }

        .inr-box {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .inr-box:hover {
            transform: scale(1.1);
        }
        footer{
            background-color: black;
            padding: 20px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            bottom: 0;
            width: 100%;
        }
        .line
        {
            width: 100%;
            height: 2px;
            background-color: black;
            margin-top:10px ;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <p>Find the same color</p>
            <nav>
                <h3>Count: <span id="score">0</span></h3>
            </nav>
        </div>
    </header>

    <div id="color" class="inr-box"></div>
 <div class="line"></div>
    <div class="box-container">
        <div class="container" id="box-con"></div>
    </div>
<footer> <p>Design & created by Mohsin  &copy; 2025</p></footer>
    <script>
        let boxCon = document.getElementById("box-con");
        const colors_arr = [
            "black",
            "green",
            "blue",
            "pink",
            "yellow",
            "red",
            "brown",
            "gray",
            "navy"
        ];

        let count = document.getElementById("score");
        let color = document.getElementById("color");
        let all_elements = document.getElementsByClassName("inr-box");
        let random_num = Math.floor(Math.random() * 9);
        color.style.backgroundColor = colors_arr[random_num];
        boxescolor();
    function boxescolor(){

        for (let i = 0; i < 50; i++) {
            let random_num1 = Math.floor(Math.random() * 9);
            let newBox = document.createElement("div");
            newBox.className = "inr-box";
            newBox.style.backgroundColor = colors_arr[random_num1];
            boxCon.appendChild(newBox);
        }
    }

        boxCon.addEventListener("click", (e) => {
            if (e.target.className == "inr-box") {
                let boxclr = e.target.style.backgroundColor;

                if (color.style.backgroundColor == boxclr) {
                    count.innerHTML = ++count.innerHTML;
                    random_num = Math.floor(Math.random() * 9);
                    color.style.backgroundColor = colors_arr[random_num];
                    
                    // Clear previous boxes
                    boxCon.innerHTML = "";

                    // Generate new boxes
                    boxescolor();
                }
            }
        });
    </script>
</body>
</html>

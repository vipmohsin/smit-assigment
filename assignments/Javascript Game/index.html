<!DOCTYPE html>
<html>
<head>
    <title>Color Match Game | By Mohsin Khan</title>
    <style>
             * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f0f0;
            text-align: center;
         
        }

        header {
            margin-bottom: 20px;
            background-color: black;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        #color {
            font-size: 2.5rem;
            width: 60px;
            height: 60px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin: 20px 0;
            color: #333;
            border: 20px;
            margin: 0 auto;
        }

        nav h3 {
            font-size: 1.2rem;
            color: white;
        }

        #score {
            font-weight: bold;
            color: green;
        }

        .box-container {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        #box-con {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 10px;
            width: 100%;
            max-width: 600px;
        }

        .inr-box {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .inr-box:hover {
            transform: scale(1.1);
        }
        footer{
            background-color: black;
            padding: 20px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            bottom: 0;
            width: 100%;
        }
        .line
        {
            width: 100%;
            height: 2px;
            background-color: black;
            margin-top:10px ;
        }
        nav{
            display: flex;
            justify-content: start;
            align-items: center;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div class="back">
        <a href="../../index.html" style="text-decoration: none; color: white;">
    
          <- Back
        </a>
      </div>
    <header>
        <div class="container">
           
            <nav>
                <h3>Count:  </h3>
                <h3 id="score"></h3>
            </nav>
        </div>
    </header>

    <div id="color" class="inr-box"></div>
    <div class="line"></div>
    <p style="font-weight: bold; font-size: 20px; margin-top: 10px;"> Find the same color</p>
    <div class="box-container">
        <div class="container" id="box-con"></div>
    </div>
<footer> <p>Design & created by Mohsin  &copy; 2025</p></footer>
    <script>
        let boxCon = document.getElementById("box-con");
        const colors_arr = [
            "black",
            "green",
            "blue",
            "pink",
            "yellow",
            "red",
            "brown",
            "gray",
            "navy"
        ];

        let count = document.getElementById("score");
        let color = document.getElementById("color");
        let all_elements = document.getElementsByClassName("inr-box");
        let random_num = Math.floor(Math.random() * 9);
        color.style.backgroundColor = colors_arr[random_num];
        boxescolor();
    function boxescolor(){

        for (let i = 0; i < 50; i++) {
            let random_num1 = Math.floor(Math.random() * 9);
            let newBox = document.createElement("div");
            newBox.className = "inr-box";
            newBox.style.backgroundColor = colors_arr[random_num1];
            boxCon.appendChild(newBox);
        }
    }
    let isFirstPick = true;

    boxCon.addEventListener("click", (e) => {
        if (e.target.className == "inr-box") {
            let boxclr = e.target.style.backgroundColor;

            if (isFirstPick) {
                startTimer();
                isFirstPick = false;
            }

            if (color.style.backgroundColor == boxclr) {
                count.innerHTML = ++count.innerHTML;

                if (parseInt(count.innerHTML) > highScore) {
                    highScore = parseInt(count.innerHTML);
                    highScoreDisplay.textContent = `High Score: ${highScore}`;
                }

                random_num = Math.floor(Math.random() * 9);
                color.style.backgroundColor = colors_arr[random_num];
                
                // Clear previous boxes
                boxCon.innerHTML = "";

                // Generate new boxes
                boxescolor();
            }
        }
    });
        let timer;
        let highScore = 0;
        const highScoreDisplay = document.createElement("h3");
        highScoreDisplay.textContent = `High Score: ${highScore}`;
        document.querySelector("nav").appendChild(highScoreDisplay);

        const timerDisplay = document.createElement("div");
        timerDisplay.style.position = "absolute";
        timerDisplay.style.top = "10px";
        timerDisplay.style.right = "10px";
        timerDisplay.style.backgroundColor = "black";
        timerDisplay.style.color = "white";
        timerDisplay.style.padding = "10px";
        timerDisplay.style.borderRadius = "5px";
        timerDisplay.textContent = "Time: 10s";
        document.body.appendChild(timerDisplay);

        function resetGame() {
            count.innerHTML = 0;
            random_num = Math.floor(Math.random() * 9);
            color.style.backgroundColor = colors_arr[random_num];
            boxCon.innerHTML = "";
            boxescolor();
        }

        function startTimer() {
            clearTimeout(timer);
            var timeLeft = 10;
            timerDisplay.textContent = `Time: ${timeLeft}s`;

            timer = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = `Time: ${timeLeft}s`;

                if (timeLeft <= 0) {
                    clearInterval(timer);

                    // Create a popup
                    const popup = document.createElement("div");
                    popup.style.position = "fixed";
                    popup.style.top = "50%";
                    popup.style.left = "50%";
                    popup.style.transform = "translate(-50%, -50%)";
                    popup.style.backgroundColor = "white";
                    popup.style.color = "black";
                    popup.style.padding = "20px";
                    popup.style.border = "2px solid black";
                    popup.style.borderRadius = "10px";
                    popup.style.boxShadow = "0 4px 8px rgba(0, 0, 0, 0.2)";
                    popup.innerHTML = `
                        <p>Time's up! You lost.</p>
                        <button id="closePopup" style="padding: 10px 20px; background-color: black; color: white; border: none; border-radius: 5px; cursor: pointer;">Close</button>
                    `;

                    document.body.appendChild(popup);

                    // Add event listener to close the popup
                    document.getElementById("closePopup").addEventListener("click", () => {
                        document.body.removeChild(popup);
                        resetGame();
                    });
                }
                timeLeft--;
                timerDisplay.textContent = `Time: ${timeLeft}s`;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                   // Create a popup
                   const popup = document.createElement("div");
                    popup.style.position = "fixed";
                    popup.style.top = "50%";
                    popup.style.left = "50%";
                    popup.style.transform = "translate(-50%, -50%)";
                    popup.style.backgroundColor = "white";
                    popup.style.color = "black";
                    popup.style.padding = "20px";
                    popup.style.border = "2px solid black";
                    popup.style.borderRadius = "10px";
                    popup.style.boxShadow = "0 4px 8px rgba(0, 0, 0, 0.2)";
                    popup.innerHTML = `
                        <p>Time's up! You lost.</p>
                        <button id="closePopup" style="padding: 10px 20px; background-color: black; color: white; border: none; border-radius: 5px; cursor: pointer;">Close</button>
                    `;

                    document.body.appendChild(popup);

                    // Add event listener to close the popup
                    document.getElementById("closePopup").addEventListener("click", () => {
                        document.body.removeChild(popup);
                        resetGame();
                    });
                    resetGame();
                }
            }, 1000);
        }

        boxCon.addEventListener("click", (e) => {
            if (e.target.className == "inr-box") {
                let boxclr = e.target.style.backgroundColor;

                if (color.style.backgroundColor == boxclr) {
                    count.innerHTML = ++count.innerHTML;
                   
                    timeLeft = 10; // Reset time left to 10 seconds
                    if (parseInt(count.innerHTML) > highScore) {
                        highScore = parseInt(count.innerHTML);
                        highScoreDisplay.textContent = `High Score: ${highScore}`;
                    }

                    random_num = Math.floor(Math.random() * 9);
                    color.style.backgroundColor = colors_arr[random_num];
                    
                    // Clear previous boxes
                    boxCon.innerHTML = "";

                    // Generate new boxes
                    boxescolor();

                    // Restart timer
                    timeLeft = 10;
                }
            }
        });

        // Start the timer initially
        
    </script>
</body>
</html>
